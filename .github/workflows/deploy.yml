name: Deploy to GitHub Pages

# Pushes to `main` build AND deploy. Pushes to `dev` (including merge commits
# from feature branches) build only, so dev's build health is visible without
# touching production. Pull requests into either branch build only.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restore eleventy-img's generated variants between runs so deploys
      # don't re-process every image through Sharp on every build. Output
      # filenames in _site/img/ are content-hashed by source bytes + options,
      # so existing variants short-circuit Sharp work for unchanged sources.
      # The cache key is bound to the source attachment tree; any add/edit/
      # delete under src/content/_attachments/ produces a different hash and
      # a fresh cache entry. The restore-keys fallback ensures partial cache
      # reuse when only a subset of images changed (the new ones get processed,
      # everything else hits the restored cache).
      - name: Restore eleventy-img cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: _site/img
          key: eleventy-img-${{ hashFiles('src/content/_attachments/**') }}
          restore-keys: |
            eleventy-img-

      # Capture the currently-live Atom feed BEFORE building. The Discord
      # new-post detection diffs this snapshot against the freshly-built
      # _site/feed.xml later in this job. Only runs on main pushes since
      # that's the only path that announces.
      #
      # Cloudflare (fronting fractured-jaw.com) 403s on default-UA curl
      # from GitHub Actions runner IPs as a bot-mitigation default. Send
      # an identifying User-Agent and an explicit Accept header so the
      # request looks like a legitimate feed fetch rather than anonymous
      # automation. If Cloudflare ever tightens further, the next escape
      # hatch is a WAF allow rule on this UA string.
      - name: Fetch live feed snapshot
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          curl -fsSL \
            -A "fractured-jaw-deploy/1.0 (+https://github.com/wool-worm/fractured-jaw)" \
            -H "Accept: application/atom+xml, application/xml, text/xml, */*" \
            https://fractured-jaw.com/feed.xml -o previous-feed.xml

      # Same idea for the announcements webhook: snapshot the currently-live
      # /announcements.json so detect-new-announcements.js can diff it against
      # the freshly-built one. Unlike the feed fetch this is `|| true`: on the
      # very first deploy (before /announcements.json exists) the 404 must NOT
      # fail the build. A missing/invalid snapshot makes the detect script
      # establish a baseline and announce nothing, so existing announcements
      # are never spammed on first run.
      - name: Fetch live announcements snapshot
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          curl -fsSL \
            -A "fractured-jaw-deploy/1.0 (+https://github.com/wool-worm/fractured-jaw)" \
            -H "Accept: application/json, */*" \
            https://fractured-jaw.com/announcements.json -o previous-announcements.json || true

      - name: Build site
        run: npm run build

      # Diff previous feed vs. _site/feed.xml, emit new-posts.json with
      # title/url/description/authors/tags/published/image per new entry.
      # Fails the workflow if previous feed parsed to zero entries (set
      # repo variable ALLOW_EMPTY_PREVIOUS_FEED=true to bypass the guard).
      - name: Detect new posts
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ALLOW_EMPTY_PREVIOUS_FEED: ${{ vars.ALLOW_EMPTY_PREVIOUS_FEED }}
        run: |
          node .github/scripts/detect-new-posts.js \
            previous-feed.xml \
            _site/feed.xml \
            _site/search-index.json \
            new-posts.json

      # Pass the new-posts payload from the build job to the deploy job.
      - name: Upload new-posts payload
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: new-posts
          path: new-posts.json
          retention-days: 1

      # Newsletter eligibility allowlist (post URLs not opted out via
      # `newsletter_enabled: false`). Emitted every build by
      # src/newsletter-feed.11ty.js; the Buttondown sender in the deploy job
      # intersects it with new-posts.json so a suppressed post is never
      # drafted. Only needed downstream on main.
      - name: Upload newsletter allowlist
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newsletter
          path: _site/newsletter.json
          retention-days: 1

      # Diff the live /announcements.json snapshot vs the freshly-built one,
      # emit new-announcements.json. Baseline-safe: a missing/invalid previous
      # snapshot announces nothing (see detect-new-announcements.js).
      - name: Detect new announcements
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          node .github/scripts/detect-new-announcements.js \
            previous-announcements.json \
            _site/announcements.json \
            new-announcements.json

      - name: Upload new-announcements payload
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: new-announcements
          path: new-announcements.json
          retention-days: 1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

      # If anything failed during a real production build, surface it to
      # the system webhook so the author sees it without polling the
      # Actions tab. Skips PR builds and dev pushes.
      - name: Post build failure to Discord system
        if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_SYSTEM }}
          DEPLOY_STATUS: build_failed
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/post-system.js

  deploy:
    needs: build
    # Deploy only on main pushes (and manual dispatches against main).
    # PR builds and dev builds stop after the artifact upload.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Needed for .github/scripts/ used by the steps below. The build
      # artifact uploaded by actions/upload-pages-artifact is consumed by
      # actions/deploy-pages directly; this checkout is only for our
      # Discord-posting scripts.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # Flush Cloudflare's edge cache after a successful deploy so the new
      # build is visible to readers immediately instead of waiting out the
      # browser-cache TTL on every CDN node. Paired with a long Browser
      # Cache TTL in the Cloudflare dashboard: repeat visitors get
      # aggressively-cached assets, fresh content lands on the next request
      # after each deploy. Token is scoped to Cache Purge on this one zone
      # only, so worst-case leakage just means someone could purge our
      # cache (annoying, not destructive). continue-on-error so a transient
      # Cloudflare API blip doesn't fail the workflow after the Pages
      # deploy itself already succeeded.
      - name: Purge Cloudflare cache
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      # Best-effort download of the new-posts payload. continue-on-error
      # so a degenerate build (no detection step) doesn't fail the deploy
      # job after the actual Pages deploy succeeded.
      - name: Download new-posts payload
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: new-posts

      # Post one Discord embed per new post to the dispatches channel.
      # continue-on-error so a Discord outage doesn't fail the workflow
      # after the actual deploy succeeded.
      - name: Post new posts to Discord dispatches
        if: steps.deployment.outcome == 'success' && hashFiles('new-posts.json') != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_DISPATCHES: ${{ secrets.DISCORD_WEBHOOK_DISPATCHES }}
        run: node .github/scripts/post-dispatches.js new-posts.json

      # Best-effort download of the newsletter allowlist (same shape pattern
      # as the new-posts download above).
      - name: Download newsletter allowlist
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: newsletter

      # Draft ONE Buttondown email containing a stacked digest of every new,
      # newsletter-eligible post from this deploy (N posts => 1 email with N
      # cards, not N emails). Draft status only: it lands in the Buttondown
      # dashboard for manual review + send, nothing goes out automatically.
      # continue-on-error so a Buttondown outage doesn't fail the workflow
      # after the deploy already succeeded. Needs both payloads present.
      - name: Draft newsletter email to Buttondown
        if: steps.deployment.outcome == 'success' && hashFiles('new-posts.json') != '' && hashFiles('newsletter.json') != ''
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node .github/scripts/post-buttondown.js new-posts.json newsletter.json

      # Best-effort download of the new-announcements payload, same shape as
      # the new-posts download above.
      - name: Download new-announcements payload
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: new-announcements

      # Post one Discord embed per new announcement to the announcements
      # channel. continue-on-error so a Discord outage doesn't fail the
      # workflow after the actual deploy succeeded.
      - name: Post new announcements to Discord announcements
        if: steps.deployment.outcome == 'success' && hashFiles('new-announcements.json') != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_ANNOUNCEMENTS: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
        run: node .github/scripts/post-announcements.js new-announcements.json

      - name: Post deploy success to Discord system
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_SYSTEM }}
          DEPLOY_STATUS: ok
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: node .github/scripts/post-system.js

      - name: Post deploy failure to Discord system
        if: steps.deployment.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_SYSTEM }}
          DEPLOY_STATUS: failed
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/post-system.js
